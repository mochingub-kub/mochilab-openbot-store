name: Mochilab V3 isolated regression
on:
  pull_request:
    paths:
      - "tools/v3_*"
      - "tools/test_v3_*"
      - "deploy/workspace-v3/**"
      - ".github/workflows/v3-isolated.yml"
  push:
    branches:
      - "design/workspace-only-v3-semantic-patch"
    paths:
      - "tools/v3_*"
      - "tools/test_v3_*"
      - "deploy/workspace-v3/**"
      - ".github/workflows/v3-isolated.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: python -m compileall -q tools/v3_compose_plan.py tools/v3_workspace_transaction.py tools/v3_backup_only.py
      - run: python -m unittest -v tools/test_v3_compose_plan.py tools/test_v3_workspace_transaction.py
      - run: bash -n deploy/workspace-v3/pre-start
      - name: Artifact pinned Git blob verification
        shell: bash
        run: |
          test "$(git hash-object deploy/workspace-v3/mochilab-openbot-workspace.apparmor)" = afd0d87e7a09e39afad12864fb988586ce95104e
          test "$(git hash-object deploy/workspace-v3/seccomp-workspace.json)" = 4fa610c6303f4610844dc6ae0da5546030a77cbb
          test "$(git hash-object deploy/workspace-v3/pre-start)" = f0f6de6bea47df28595449c2f766a99c804aaab2
      - run: git diff --check HEAD^ HEAD
