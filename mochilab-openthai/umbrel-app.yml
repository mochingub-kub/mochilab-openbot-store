manifestVersion: 1.1
id: mochilab-openthai
# Enable only after the reviewed main-branch image is built and pinned.
disabled: true
name: OpenThai Dictation
tagline: Thai speech recognition and spoken replies for OpenBot
category: ai
version: "0.2.0"
port: 18081
storage:
  dataRoot: data
deterministicPassword: true
description: >-
  Run OpenThai 2.0 FP32 speech recognition and MakHam Paradee FP32 Thai speech
  synthesis on your Umbrel CPU. This app provides a bearer-authenticated
  OpenAI-compatible voice API (/v1/models, /v1/audio/transcriptions,
  /v1/audio/speech, and /v1/audio/voices). Use its Umbrel Credentials password
  as the API key. The first start downloads checksum-pinned model files into app
  data. No browser UI is provided.
developer: Mochilab
website: https://huggingface.co/iapp/OpenThai2.0-ASR-Streaming-ONNX
repo: https://github.com/mochingub-kub/mochilab-openbot-store
support: https://github.com/mochingub-kub/mochilab-openbot-store#support-and-liability
gallery: []
dependencies: []
releaseNotes: >-
  Add Thai spoken replies (POST /v1/audio/speech and GET /v1/audio/voices) with
  pinned MakHam Paradee FP32 and FastThaiG2P alongside OpenThai 2.0 ASR.
