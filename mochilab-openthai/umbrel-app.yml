manifestVersion: 1.1
id: mochilab-openthai
name: Siang เสียง
tagline: Thai speech-to-text and spoken replies on your Umbrel
icon: https://raw.githubusercontent.com/mochingub-kub/mochilab-openbot-store/main/mochilab-openthai/icon.svg
category: ai
version: "0.2.1"
port: 18081
storage:
  dataRoot: data
deterministicPassword: true
description: >-
  Dictate in Thai and hear Thai spoken replies in OpenBot. Siang runs iApp OpenThai
  speech recognition and MakHam Paradee speech synthesis on your Umbrel CPU.
  Speech processing stays on your Umbrel. Connect OpenBot to the OpenAI-compatible
  Voice server API using the password in Umbrel App Settings. Models are stored
  in app data and reused across updates. Setup takes place in Umbrel and OpenBot.
developer: Mochilab
submitter: Mochilab
website: https://github.com/mochingub-kub/mochilab-openbot-store/tree/main/mochilab-openthai
repo: https://github.com/mochingub-kub/mochilab-openbot-store
support: https://github.com/mochingub-kub/mochilab-openbot-store#support-and-liability
gallery: []
dependencies: []
releaseNotes: >-
  Rename OpenThai Dictation to Siang เสียง for Thai dictation and spoken replies.
  This store update uses the same runtime image and keeps the API key, models,
  and Voice server setup in place.
